<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>银行客户话术助手</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #f0f4f8;
    color: #1a2233;
    min-height: 100vh;
  }

  header {
    background: linear-gradient(135deg, #1a3a6b 0%, #2563b0 100%);
    color: #fff;
    padding: 18px 20px 14px;
    text-align: center;
  }
  header h1 { font-size: 1.15rem; font-weight: 700; letter-spacing: .04em; }
  header p  { font-size: .78rem; opacity: .8; margin-top: 4px; }

  .container { max-width: 480px; margin: 0 auto; padding: 16px 14px 40px; }

  /* 步骤指示器 */
  .steps {
    display: flex; align-items: center; justify-content: center;
    gap: 8px; margin-bottom: 20px;
  }
  .step {
    display: flex; align-items: center; gap: 6px;
    font-size: .78rem; color: #8a9ab5;
  }
  .step .dot {
    width: 24px; height: 24px; border-radius: 50%;
    background: #d1dbe8; color: #8a9ab5;
    display: flex; align-items: center; justify-content: center;
    font-size: .72rem; font-weight: 700;
  }
  .step.active .dot { background: #2563b0; color: #fff; }
  .step.active       { color: #2563b0; font-weight: 600; }
  .step.done .dot    { background: #22c55e; color: #fff; }
  .step-line { flex: 1; height: 2px; background: #d1dbe8; max-width: 32px; }

  /* 区块标题 */
  .section-title {
    font-size: .88rem; font-weight: 700; color: #4b5c78;
    margin-bottom: 12px; letter-spacing: .03em;
  }

  /* 性格卡片网格 */
  .personality-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
  }
  .personality-grid .card-5th { grid-column: 1 / -1; }

  .p-card {
    background: #fff; border-radius: 14px;
    padding: 16px 14px; cursor: pointer;
    border: 2px solid transparent;
    box-shadow: 0 1px 6px rgba(0,0,0,.06);
    transition: border-color .15s, box-shadow .15s, transform .1s;
    text-align: center;
    -webkit-tap-highlight-color: transparent;
  }
  .p-card:active { transform: scale(.97); }
  .p-card.selected {
    border-color: #2563b0;
    box-shadow: 0 2px 12px rgba(37,99,176,.18);
  }
  .p-card .icon { font-size: 2rem; margin-bottom: 6px; }
  .p-card .name { font-size: .95rem; font-weight: 700; color: #1a2233; }
  .p-card .desc { font-size: .72rem; color: #7a8ca8; margin-top: 4px; line-height: 1.4; }

  /* 第5张卡水平布局 */
  .p-card.card-5th { display: flex; align-items: center; gap: 14px; text-align: left; padding: 14px 20px; }
  .p-card.card-5th .icon { font-size: 1.8rem; margin-bottom: 0; flex-shrink: 0; }
  .p-card.card-5th .text { flex: 1; }

  /* 业务按钮 */
  .biz-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .biz-btn {
    background: #fff; border-radius: 12px;
    padding: 14px 10px; cursor: pointer;
    border: 2px solid transparent;
    box-shadow: 0 1px 6px rgba(0,0,0,.06);
    transition: border-color .15s, transform .1s;
    text-align: center; font-size: .9rem; font-weight: 600;
    color: #2563b0;
    -webkit-tap-highlight-color: transparent;
  }
  .biz-btn .biz-icon { font-size: 1.5rem; display: block; margin-bottom: 5px; }
  .biz-btn:active  { transform: scale(.97); }
  .biz-btn.selected {
    border-color: #2563b0;
    background: #eef4ff;
  }

  /* 选中摘要 */
  .selection-bar {
    background: #eef4ff; border-radius: 10px;
    padding: 8px 14px; font-size: .8rem; color: #2563b0;
    margin-bottom: 14px; display: flex; align-items: center; gap: 6px;
    font-weight: 600;
  }
  .selection-bar span { opacity: .7; font-weight: 400; }

  /* 话术卡片 */
  .script-card {
    background: #fff; border-radius: 16px;
    box-shadow: 0 2px 12px rgba(0,0,0,.07);
    overflow: hidden; margin-bottom: 12px;
  }
  .script-card-header {
    padding: 14px 16px 10px;
    border-bottom: 1px solid #f0f4f8;
    font-size: .85rem; font-weight: 700; color: #1a2233;
    display: flex; align-items: center; gap: 8px;
  }
  .script-tag {
    display: inline-block; padding: 2px 9px;
    border-radius: 20px; font-size: .7rem; font-weight: 700;
    letter-spacing: .04em;
  }
  .tag-open   { background: #dbeafe; color: #1d4ed8; }
  .tag-pitch  { background: #dcfce7; color: #166534; }
  .tag-obj    { background: #fef9c3; color: #854d0e; }
  .tag-close  { background: #fce7f3; color: #9d174d; }

  .script-body { padding: 12px 16px 14px; font-size: .88rem; line-height: 1.75; color: #374151; }
  .script-body p { margin-bottom: 6px; }
  .script-body p:last-child { margin-bottom: 0; }

  /* 按钮 */
  .btn-reset {
    display: block; width: 100%; padding: 14px;
    background: #2563b0; color: #fff;
    border: none; border-radius: 12px;
    font-size: .95rem; font-weight: 700; cursor: pointer;
    margin-top: 8px; letter-spacing: .04em;
    -webkit-tap-highlight-color: transparent;
  }
  .btn-reset:active { opacity: .85; }

  .btn-back {
    display: inline-flex; align-items: center; gap: 4px;
    background: none; border: none; color: #2563b0;
    font-size: .82rem; cursor: pointer; padding: 4px 0;
    margin-bottom: 14px; font-weight: 600;
    -webkit-tap-highlight-color: transparent;
  }

  .hidden { display: none !important; }
</style>
</head>
<body>

<header>
  <h1>🏦 银行客户话术助手</h1>
  <p>选择客户性格和业务类型，快速获取沟通话术</p>
</header>

<div class="container">

  <!-- 步骤指示器 -->
  <div class="steps" id="stepsBar">
    <div class="step active" id="step1Ind"><div class="dot">1</div> 选择性格</div>
    <div class="step-line"></div>
    <div class="step" id="step2Ind"><div class="dot">2</div> 选择业务</div>
    <div class="step-line"></div>
    <div class="step" id="step3Ind"><div class="dot">3</div> 查看话术</div>
  </div>

  <!-- Step 1: 选性格 -->
  <div id="step1">
    <div class="section-title">请选择客户性格类型</div>
    <div class="personality-grid" id="personalityGrid"></div>
  </div>

  <!-- Step 2: 选业务 -->
  <div id="step2" class="hidden">
    <button class="btn-back" onclick="goBack(1)">← 重新选择性格</button>
    <div class="section-title">请选择办理业务</div>
    <div class="biz-grid" id="bizGrid"></div>
  </div>

  <!-- Step 3: 话术展示 -->
  <div id="step3" class="hidden">
    <button class="btn-back" onclick="goBack(2)">← 重新选择业务</button>
    <div class="selection-bar" id="selectionBar"></div>
    <div id="scriptContent"></div>
    <button class="btn-reset" onclick="reset()">重新开始</button>
  </div>

</div>

      open:      '您好，开户流程我来帮您走最快的，不让您多等一分钟。',
      pitch:     '整个流程 10 分钟，您只需要配合我看一下身份证，其余全部我来操作。<br>开好之后手机银行当场激活，回家就能用，不用再跑一趟。',
      objection: '我理解您的不耐烦，是我们的程序让您费时间了，我来想办法优化这个步骤。',
      close:     '马上开始，我帮您盯着，出来第一个叫您。'
    },
    complaint: {
      open:      '您好，我看到您很生气，这是您应有的反应，我来认真处理这件事。',
      pitch:     '首先，我为我们工作的疏漏向您道歉。<br>现在我需要您把问题告诉我，我来立刻启动处理流程，不让这件事再拖下去。',
      objection: '您说得对，这件事不应该发展到这一步，我不会为过失找理由，我只负责帮您解决它。',
      close:     '我现在直接升级给我的主管，您等我五分钟，我带着处理方案回来，绝不让您空手而归。'
    }
  }
};

// ─── 状态 ────────────────────────────────────────────────────────────────────
let selectedPersonality = null;
let selectedBusiness    = null;

// ─── 渲染 ─────────────────────────────────────────────────────────────────────
function renderPersonalities() {
  const grid = document.getElementById('personalityGrid');
  grid.innerHTML = '';
  personalities.forEach((p, i) => {
    const is5th = i === 4;
    const div = document.createElement('div');
    div.className = 'p-card' + (is5th ? ' card-5th' : '');
    if (is5th) div.classList.add('card-5th');
    div.innerHTML = is5th
      ? `<div class="icon">${p.icon}</div><div class="text"><div class="name">${p.name}</div><div class="desc">${p.desc}</div></div>`
      : `<div class="icon">${p.icon}</div><div class="name">${p.name}</div><div class="desc">${p.desc}</div>`;
    if (is5th) {
      const wrapper = document.createElement('div');
      wrapper.className = 'card-5th';
      wrapper.appendChild(div);
      grid.appendChild(wrapper);
    } else {
      grid.appendChild(div);
    }
    div.onclick = () => selectPersonality(p.id);
  });
}

function renderBusinesses() {
  const grid = document.getElementById('bizGrid');
  grid.innerHTML = '';
  businesses.forEach(b => {
    const btn = document.createElement('button');
    btn.className = 'biz-btn';
    btn.innerHTML = `<span class="biz-icon">${b.icon}</span>${b.name}`;
    btn.onclick = () => selectBusiness(b.id);
    grid.appendChild(btn);
  });
}

function renderScript() {
  const p = personalities.find(x => x.id === selectedPersonality);
  const b = businesses.find(x => x.id === selectedBusiness);
  const s = scripts[selectedPersonality][selectedBusiness];

  document.getElementById('selectionBar').innerHTML =
    `${p.icon} <strong>${p.name}</strong> <span>×</span> ${b.icon} <strong>${b.name}</strong>`;

  const sections = [
    { tag: 'tag-open',  label: '开场接待', text: s.open },
    { tag: 'tag-pitch', label: '核心话术', text: s.pitch },
    { tag: 'tag-obj',   label: '异议处理', text: s.objection },
    { tag: 'tag-close', label: '促成结语', text: s.close }
  ];

  document.getElementById('scriptContent').innerHTML = sections.map(sec => `
    <div class="script-card">
      <div class="script-card-header">
        <span class="script-tag ${sec.tag}">${sec.label}</span>
      </div>
      <div class="script-body"><p>${sec.text}</p></div>
    </div>
  `).join('');
}

// ─── 交互 ─────────────────────────────────────────────────────────────────────
function selectPersonality(id) {
  selectedPersonality = id;
  document.querySelectorAll('.p-card').forEach(c => c.classList.remove('selected'));
  // 找到对应卡片并标记
  document.querySelectorAll('.p-card').forEach(c => {
    const pData = personalities.find(p => p.id === id);
    if (c.querySelector('.name') && c.querySelector('.name').textContent === pData.name) {
      c.classList.add('selected');
    }
  });
  setTimeout(() => goToStep(2), 180);
}

function selectBusiness(id) {
  selectedBusiness = id;
  document.querySelectorAll('.biz-btn').forEach(b => b.classList.remove('selected'));
  event.currentTarget.classList.add('selected');
  setTimeout(() => goToStep(3), 180);
}

function goToStep(n) {
  document.getElementById('step1').classList.toggle('hidden', n !== 1);
  document.getElementById('step2').classList.toggle('hidden', n !== 2);
  document.getElementById('step3').classList.toggle('hidden', n !== 3);

  document.getElementById('step1Ind').className = 'step' + (n === 1 ? ' active' : n > 1 ? ' done' : '');
  document.getElementById('step2Ind').className = 'step' + (n === 2 ? ' active' : n > 2 ? ' done' : '');
  document.getElementById('step3Ind').className = 'step' + (n === 3 ? ' active' : '');

  if (n === 2) renderBusinesses();
  if (n === 3) renderScript();

  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function goBack(step) {
  if (step === 1) { selectedPersonality = null; }
  if (step === 2) { selectedBusiness = null; }
  goToStep(step);
}

function reset() {
  selectedPersonality = null;
  selectedBusiness = null;
  goToStep(1);
}

// ─── 初始化 ────────────────────────────────────────────────────────────────────
renderPersonalities();
</script>
</body>
</html>
