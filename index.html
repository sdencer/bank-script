<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>银行客户话术助手</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #f0f4f8;
    color: #1a2233;
    min-height: 100vh;
  }

  header {
    background: linear-gradient(135deg, #1a3a6b 0%, #2563b0 100%);
    color: #fff;
    padding: 18px 20px 14px;
    text-align: center;
  }
  header h1 { font-size: 1.15rem; font-weight: 700; letter-spacing: .04em; }
  header p  { font-size: .78rem; opacity: .8; margin-top: 4px; }

  .container { max-width: 480px; margin: 0 auto; padding: 16px 14px 40px; }

  /* 步骤指示器 */
  .steps {
    display: flex; align-items: center; justify-content: center;
    gap: 8px; margin-bottom: 20px;
  }
  .step {
    display: flex; align-items: center; gap: 6px;
    font-size: .78rem; color: #8a9ab5;
  }
  .step .dot {
    width: 24px; height: 24px; border-radius: 50%;
    background: #d1dbe8; color: #8a9ab5;
    display: flex; align-items: center; justify-content: center;
    font-size: .72rem; font-weight: 700;
  }
  .step.active .dot { background: #2563b0; color: #fff; }
  .step.active       { color: #2563b0; font-weight: 600; }
  .step.done .dot    { background: #22c55e; color: #fff; }
  .step-line { flex: 1; height: 2px; background: #d1dbe8; max-width: 32px; }

  .section-title {
    font-size: .88rem; font-weight: 700; color: #4b5c78;
    margin-bottom: 12px; letter-spacing: .03em;
  }

  /* 性格卡片 */
  .personality-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
  }
  .p-card {
    background: #fff; border-radius: 14px;
    padding: 16px 14px; cursor: pointer;
    border: 2px solid transparent;
    box-shadow: 0 1px 6px rgba(0,0,0,.06);
    transition: border-color .15s, box-shadow .15s, transform .1s;
    text-align: center;
    -webkit-tap-highlight-color: transparent;
  }
  .p-card:active { transform: scale(.97); }
  .p-card.selected { border-color: #2563b0; box-shadow: 0 2px 12px rgba(37,99,176,.18); }
  .p-card .icon { font-size: 2rem; margin-bottom: 6px; }
  .p-card .name { font-size: .95rem; font-weight: 700; color: #1a2233; }
  .p-card .desc { font-size: .72rem; color: #7a8ca8; margin-top: 4px; line-height: 1.4; }

  /* 场景列表 */
  .scene-list { display: flex; flex-direction: column; gap: 10px; }
  .scene-btn {
    background: #fff; border-radius: 12px;
    padding: 14px 16px; cursor: pointer;
    border: 2px solid transparent;
    box-shadow: 0 1px 6px rgba(0,0,0,.06);
    transition: border-color .15s, transform .1s;
    text-align: left;
    -webkit-tap-highlight-color: transparent;
    display: flex; align-items: flex-start; gap: 10px;
  }
  .scene-btn:active { transform: scale(.98); }
  .scene-btn.selected { border-color: #2563b0; background: #eef4ff; }
  .scene-btn .scene-num {
    width: 22px; height: 22px; border-radius: 50%;
    background: #e0e9f8; color: #2563b0;
    font-size: .7rem; font-weight: 800;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; margin-top: 1px;
  }
  .scene-btn .scene-text { flex: 1; }
  .scene-btn .scene-title { font-size: .9rem; font-weight: 700; color: #1a2233; }
  .scene-btn .scene-sub { font-size: .72rem; color: #e67e22; font-weight: 600; margin-top: 2px; }
  .scene-btn .scene-quote {
    font-size: .75rem; color: #7a8ca8; margin-top: 4px;
    line-height: 1.4; display: -webkit-box;
    -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }

  /* 顶部摘要 */
  .selection-bar {
    background: #eef4ff; border-radius: 10px;
    padding: 8px 14px; font-size: .8rem; color: #2563b0;
    margin-bottom: 14px; font-weight: 600; line-height: 1.5;
  }

  /* 客户原话 */
  .customer-quote {
    background: #fff8e1; border-left: 3px solid #f59e0b;
    border-radius: 0 10px 10px 0;
    padding: 10px 14px; margin-bottom: 12px;
    font-size: .82rem; color: #78350f; line-height: 1.7;
    font-style: italic;
  }
  .customer-quote-label {
    font-size: .7rem; font-weight: 800; color: #b45309;
    margin-bottom: 4px; font-style: normal; letter-spacing: .04em;
  }

  /* 3F分析卡 */
  .analysis-card {
    background: #fff; border-radius: 12px;
    box-shadow: 0 1px 6px rgba(0,0,0,.06);
    overflow: hidden; margin-bottom: 10px;
  }
  .analysis-header {
    background: #f8faff; padding: 10px 14px;
    font-size: .78rem; font-weight: 800; color: #4b5c78;
    letter-spacing: .04em; border-bottom: 1px solid #eef2f8;
  }
  .analysis-body { padding: 10px 14px; display: flex; flex-direction: column; gap: 8px; }
  .analysis-row { display: flex; gap: 8px; align-items: flex-start; }
  .analysis-tag {
    display: inline-block; padding: 2px 8px; border-radius: 20px;
    font-size: .68rem; font-weight: 800; flex-shrink: 0; margin-top: 2px;
    white-space: nowrap;
  }
  .tag-fact    { background: #dbeafe; color: #1d4ed8; }
  .tag-feeling { background: #fce7f3; color: #9d174d; }
  .tag-focus   { background: #dcfce7; color: #166534; }
  .analysis-text { font-size: .8rem; color: #374151; line-height: 1.65; }
  .analysis-text .mine { color: #b45309; font-weight: 700; }
  .analysis-text .good { color: #166534; font-weight: 700; }

  /* 易错 & 破局 */
  .warn-card {
    background: #fff7ed; border-radius: 10px;
    padding: 10px 14px; margin-bottom: 10px;
    border: 1px solid #fed7aa;
  }
  .warn-label {
    font-size: .7rem; font-weight: 800; color: #c2410c;
    margin-bottom: 4px; letter-spacing: .04em;
  }
  .warn-text { font-size: .8rem; color: #7c2d12; line-height: 1.65; }

  .tip-card {
    background: #f0fdf4; border-radius: 10px;
    padding: 10px 14px; margin-bottom: 12px;
    border: 1px solid #bbf7d0;
  }
  .tip-label {
    font-size: .7rem; font-weight: 800; color: #15803d;
    margin-bottom: 4px; letter-spacing: .04em;
  }
  .tip-text { font-size: .8rem; color: #14532d; line-height: 1.65; }

  /* 话术卡片 */
  .script-card {
    background: #fff; border-radius: 14px;
    box-shadow: 0 2px 10px rgba(0,0,0,.06);
    overflow: hidden; margin-bottom: 10px;
  }
  .script-card-header {
    padding: 11px 14px 8px;
    border-bottom: 1px solid #f0f4f8;
    display: flex; align-items: center; gap: 8px;
  }
  .script-tag {
    display: inline-block; padding: 2px 9px;
    border-radius: 20px; font-size: .7rem; font-weight: 800;
    letter-spacing: .04em;
  }
  .tag-open   { background: #dbeafe; color: #1d4ed8; }
  .tag-pitch  { background: #dcfce7; color: #166534; }
  .tag-obj    { background: #fef9c3; color: #854d0e; }
  .tag-close  { background: #fce7f3; color: #9d174d; }
  .script-body {
    padding: 10px 14px 12px;
    font-size: .86rem; line-height: 1.8; color: #374151;
  }

  /* 按钮 */
  .btn-reset {
    display: block; width: 100%; padding: 14px;
    background: #2563b0; color: #fff;
    border: none; border-radius: 12px;
    font-size: .95rem; font-weight: 700; cursor: pointer;
    margin-top: 10px; letter-spacing: .04em;
    -webkit-tap-highlight-color: transparent;
  }
  .btn-reset:active { opacity: .85; }
  .btn-back {
    display: inline-flex; align-items: center; gap: 4px;
    background: none; border: none; color: #2563b0;
    font-size: .82rem; cursor: pointer; padding: 4px 0;
    margin-bottom: 14px; font-weight: 600;
    -webkit-tap-highlight-color: transparent;
  }

  .hidden { display: none !important; }
</style>
</head>
<body>

<header>
  <h1>🏦 银行客户话术助手</h1>
  <p>选择客户性格和具体场景，获取精准沟通话术</p>
</header>

<div class="container">

  <div class="steps" id="stepsBar">
    <div class="step active" id="step1Ind"><div class="dot">1</div> 选性格</div>
    <div class="step-line"></div>
    <div class="step" id="step2Ind"><div class="dot">2</div> 选场景</div>
    <div class="step-line"></div>
    <div class="step" id="step3Ind"><div class="dot">3</div> 查话术</div>
  </div>

  <div id="step1">
    <div class="section-title">请选择客户性格类型</div>
    <div class="personality-grid" id="personalityGrid"></div>
  </div>

  <div id="step2" class="hidden">
    <button class="btn-back" onclick="goBack(1)">← 重新选择性格</button>
    <div class="section-title" id="sceneTitle">请选择具体场景</div>
    <div class="scene-list" id="sceneList"></div>
  </div>

  <div id="step3" class="hidden">
    <button class="btn-back" onclick="goBack(2)">← 重新选择场景</button>
    <div class="selection-bar" id="selectionBar"></div>
    <div id="scriptContent"></div>
    <button class="btn-reset" onclick="reset()">重新开始</button>
  </div>

</div>

<script>
const personalities = [
  { id: 'dominant',   icon: '⚡', name: '支配型',  desc: '逻辑严密，强势专业，重契约，用词带刺' },
  { id: 'expressive', icon: '😊', name: '表达型',  desc: '爱唠嗑，情绪外露，易受谣言影响，需被哄' },
  { id: 'amiable',    icon: '🕊️', name: '和谐型',  desc: '讲道理，怕冲突，好面子，时间敏感' },
  { id: 'irritable',  icon: '🌋', name: '暴躁型',  desc: '脾气火爆，极易升级，吃软不吃硬' }
];

const scenes = {

  dominant: [
    {
      id: 'd1',
      title: '理财周末延期',
      sub:   '认知错位局',
      quote: '说好周五到期的理财，周末两天了钱还没到账！你们这是违约知不知道？我要打银保监电话投诉你们欺诈！',
      fact:    '周五到期理财未到账。<span class="mine">【致命暗雷】客户默认"到期=资金秒回"，忽略了周末非交易日顺延的金融常识。</span>',
      feeling: '被欺骗的愤怒、智商被冒犯的屈辱感。<span class="mine">【雷区】千万别说"这是常识/规定"，会让他觉得你在讽刺他没常识。</span>',
      focus:   '要契约精神的兑现，要维护自己"懂行"的尊严。<span class="good">【破局点】用专业对专业，拿出合同条款，把"违约"转化为"交易规则的正常履约"，给足专业尊重。</span>',
      warn:    '直接说"周末不上班所以顺延"必死。他要的不是生活常识，是合同依据。',
      tip:     '策略：引用产品说明书条款→承认告知不足→给出到账精确时间。全程保持对等的专业语气，不卑不亢。',
      open:    '您好，我来给您一个准确的制度解释，不是生活常识，是合同层面的。',
      pitch:   '根据您签署的理财产品合同第X条"到期处理"约定：到期日遇非工作日，资金划付顺延至下一工作日。周六日属法定非交易日，这是合同明确约定的正常履约，不构成违约。您的资金本周一正常到账，时间节点确定。',
      objection: '您提到卖的时候没说清楚，这点我代表我行向您致歉——告知义务确实应当更明确。我会帮您正式登记这条意见，推动我行完善销售话术。如需一份书面说明，我现在可以出具。',
      close:   '资金周一到账，我来给您发条短信确认。如需书面材料，签个名我马上打印。'
    },
    {
      id: 'd2',
      title: '扣款失败怕上征信',
      sub:   '恐慌施压局',
      quote: '我今天本来该扣房贷，凌晨卡里差了几十块没扣成功，我现在把钱转进去了！会不会上征信？我下周还要办贷款，要是黑了你们赔得起吗？',
      fact:    '房贷凌晨扣款失败，白天已补足余额。<span class="mine">【致命暗雷】客户处于"信息黑洞"中，不知道银行的扣款批次和宽限期规则。</span>',
      feeling: '极度恐慌，恐惧未知惩罚（"几十块毁了我几百万的计划"）。<span class="mine">【雷区】别说"您怎么不留够钱"（伤口撒盐），别盲目承诺"绝对不上"（越权违规）。</span>',
      focus:   '要绝对的"安全确认"，要消除对未来信用污点的恐惧。<span class="good">【破局点】用系统查询结果+明确宽限期制度给定心丸，把"你的失误"转化为"系统的容错机制"。</span>',
      warn:    '不能模糊表态"应该没事""一般不会"，他会继续逼问。必须给出制度条款和系统查询结果，两个锚点缺一不可。',
      tip:     '策略：先查系统确认本次扣款状态→报出宽限期天数→提供《还款记录证明》作为增值服务。把被动局面变成主动服务。',
      open:    '您好，我现在立刻帮您查系统，给您一个明确答复，不是估计，是查出来的结果。',
      pitch:   '（查询后）您的账户今日补足后已触发补扣，扣款已成功。关于征信：我行房贷系统设有3个自然日宽限期，首次未扣且宽限期内补足的，不产生逾期记录，不上报征信。您的情况完全在安全线内，这是制度，不是口头承诺。',
      objection: '您下周要办贷款，我建议您届时申请一份我行出具的《个人还款记录证明》，白纸黑字证明您的良好还款历史，这对您的贷款申请是正向加分材料。',
      close:   '征信无影响，结论确定。《还款记录证明》需要的话我现在就办，您看是否需要？'
    }
  ],

  expressive: [
    {
      id: 'e1',
      title: '理财抢不到怕倒闭',
      sub:   '群体恐慌局',
      quote: '哎哟小王啊，我今天特意起大早来买那个理财，你们说没额度了！是不是你们银行没钱了要倒闭了呀？我群里老姐妹都说现在银行不安全，我的钱放你们这到底安不安全哦？',
      fact:    '热门理财额度售罄。<span class="mine">【致命暗雷】大妈把"产品抢空"和"银行没钱要倒闭"画了等号，是典型的微信群谣言受害者。</span>',
      feeling: '损失厌恶、群体性恐慌。<span class="mine">【雷区】千万别硬讲"存款保险制度"，她听不进去，只会觉得你在背书敷衍。</span>',
      focus:   '要情绪上的"被重视"，要极其通俗的"大白话背书"。<span class="good">【破局点】顺着她"捧"她，用"抢手货"逻辑解释额度，用"国家兜底"的大白话给安全感。</span>',
      warn:    '不能上来就讲制度讲数据，她会觉得你在背稿糊弄。要先让她感受到"被特别关注"，情绪稳了才能听进去内容。',
      tip:     '策略：先夸她消息灵→用超市特价打比方解释额度→用最简单一句话给安全感→登记通知+替代产品收尾。全程叫"阿姨"。',
      open:    '哎呀阿姨，您一大早就来，真辛苦您了！您消息可真灵通，那款确实很受欢迎，我来给您说清楚是怎么回事。',
      pitch:   '阿姨，额度卖完跟银行倒不倒闭是两回事——就好像超市的特价鸡蛋卖完了，不代表超市要关门。我们银行有国家牌照，受银保监管，您存在这的钱，国家兜底的，安全得很！群里那些说法啊，都是谣言，您别信。',
      objection: '这款卖完了不要紧，阿姨，我帮您登记手机号，下次有新额度第一个通知您！另外我这还有一款收益差不多、随时能买的，要不要我帮您介绍一下？',
      close:   '手机号我记好了，有货马上通知您！阿姨，我再帮您把手机银行里的提醒功能开好，以后在家就能第一时间抢，不用专门跑来，好不好？'
    },
    {
      id: 'e2',
      title: 'ATM取款被限额',
      sub:   '尊严受损局',
      quote: '我这卡里明明有5万块钱，凭什么ATM上只能取2000？！我自己的钱凭什么不让我用？你们是不是看我老太婆好欺负，故意冻结我的钱？',
      fact:    'ATM取现遇到单日限额被下调。<span class="mine">【致命暗雷】大妈不懂"断卡行动"，只觉得"我的钱被冻结了"。</span>',
      feeling: '被针对的委屈、被当成"坏人"的愤怒。<span class="mine">【雷区】千万别说"这是反诈要求/保护您的钱"，她会觉得"你凭什么防我"。</span>',
      focus:   '要拿回对自己财产的"绝对控制权"，要面子。<span class="good">【破局点】把"限制"包装成"升级保护"，引导去柜台做"身份核验提额"，给她一种"我是走特殊流程"的台阶下。</span>',
      warn:    '绝对不能说"这是规定"。她要的是"被尊重"和"立刻能用钱"，要让她觉得去柜台是享受特权，不是被刁难。',
      tip:     '策略：先认同委屈感→解释是"保护您不被骗"（不是防您）→亲自陪同去柜台提额→全程叫"阿姨"，语气热情。',
      open:    '阿姨您别生气，您的钱一分都在，这绝对不是针对您的，我来给您解释清楚，然后咱们马上解决！',
      pitch:   '阿姨，这是我们最近为了保护您这样的老年客户专门做的安全升级——骗子最常用的手段就是让老人去ATM取大额现金。这个限额是保护您的，不是防您的！您的钱一分都没少，到柜台来，我亲自帮您做个身份核验，今天就给您把额度提回来，当天就能取到您要的钱。',
      objection: '阿姨，就两分钟，我陪您去，柜台那边我帮您说，您只要配合看一下身份证就好。提完额度以后，您以后取钱都方便，再也不会被限了。',
      close:   '走，阿姨我陪您去柜台，今天保证帮您把钱取出来！'
    },
    {
      id: 'e3',
      title: '代孙子开户缺材料',
      sub:   '血缘绑架局',

let selectedPersonality = null;
let selectedScene       = null;

function renderPersonalities() {
  const grid = document.getElementById('personalityGrid');
  grid.innerHTML = '';
  personalities.forEach(p => {
    const div = document.createElement('div');
    div.className = 'p-card';
    div.innerHTML = `<div class="icon">${p.icon}</div><div class="name">${p.name}</div><div class="desc">${p.desc}</div>`;
    div.onclick = () => selectPersonality(p.id);
    grid.appendChild(div);
  });
}

function renderScenes() {
  const list = document.getElementById('sceneList');
  const p = personalities.find(x => x.id === selectedPersonality);
  document.getElementById('sceneTitle').textContent = `${p.icon} ${p.name} — 请选择场景`;
  list.innerHTML = '';
  scenes[selectedPersonality].forEach((s, i) => {
    const btn = document.createElement('button');
    btn.className = 'scene-btn';
    btn.innerHTML = `
      <div class="scene-num">${i + 1}</div>
      <div class="scene-text">
        <div class="scene-title">${s.title}</div>
        <div class="scene-sub">${s.sub}</div>
        <div class="scene-quote">"${s.quote}"</div>
      </div>`;
    btn.onclick = () => selectScene(s.id);
    list.appendChild(btn);
  });
}

function renderScript() {
  const p = personalities.find(x => x.id === selectedPersonality);
  const s = scenes[selectedPersonality].find(x => x.id === selectedScene);

  document.getElementById('selectionBar').innerHTML =
    `${p.icon} <strong>${p.name}</strong> · ${s.title} <span style="color:#e67e22;font-size:.75rem;font-weight:600;"> ${s.sub}</span>`;

  document.getElementById('scriptContent').innerHTML = `
    <div class="customer-quote">
      <div class="customer-quote-label">💬 客户原话</div>
      "${s.quote}"
    </div>

    <div class="analysis-card">
      <div class="analysis-header">🔍 3F 犀利拆解</div>
      <div class="analysis-body">
        <div class="analysis-row">
          <span class="analysis-tag tag-fact">事实</span>
          <div class="analysis-text">${s.fact}</div>
        </div>
        <div class="analysis-row">
          <span class="analysis-tag tag-feeling">情绪</span>
          <div class="analysis-text">${s.feeling}</div>
        </div>
        <div class="analysis-row">
          <span class="analysis-tag tag-focus">意图</span>
          <div class="analysis-text">${s.focus}</div>
        </div>
      </div>
    </div>

    <div class="warn-card">
      <div class="warn-label">⚠️ 新人必看易错点</div>
      <div class="warn-text">${s.warn}</div>
    </div>

    <div class="tip-card">
      <div class="tip-label">💡 应对策略</div>
      <div class="tip-text">${s.tip}</div>
    </div>

    ${[
      { tag: 'tag-open',  label: '开场接待', text: s.open },
      { tag: 'tag-pitch', label: '核心话术', text: s.pitch },
      { tag: 'tag-obj',   label: '异议处理', text: s.objection },
      { tag: 'tag-close', label: '促成结语', text: s.close }
    ].map(sec => `
      <div class="script-card">
        <div class="script-card-header">
          <span class="script-tag ${sec.tag}">${sec.label}</span>
        </div>
        <div class="script-body">${sec.text}</div>
      </div>
    `).join('')}
  `;
}

function selectPersonality(id) {
  selectedPersonality = id;
  document.querySelectorAll('.p-card').forEach(c => {
    const pData = personalities.find(p => p.id === id);
    c.classList.toggle('selected', c.querySelector('.name').textContent === pData.name);
  });
  setTimeout(() => goToStep(2), 180);
}

function selectScene(id) {
  selectedScene = id;
  setTimeout(() => goToStep(3), 180);
}

function goToStep(n) {
  document.getElementById('step1').classList.toggle('hidden', n !== 1);
  document.getElementById('step2').classList.toggle('hidden', n !== 2);
  document.getElementById('step3').classList.toggle('hidden', n !== 3);
  document.getElementById('step1Ind').className = 'step' + (n === 1 ? ' active' : n > 1 ? ' done' : '');
  document.getElementById('step2Ind').className = 'step' + (n === 2 ? ' active' : n > 2 ? ' done' : '');
  document.getElementById('step3Ind').className = 'step' + (n === 3 ? ' active' : '');
  if (n === 2) renderScenes();
  if (n === 3) renderScript();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function goBack(step) {
  if (step === 1) selectedPersonality = null;
  if (step === 2) selectedScene = null;
  goToStep(step);
}

function reset() {
  selectedPersonality = null;
  selectedScene = null;
  goToStep(1);
}

renderPersonalities();
</script>
